name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: cloudsage-494513
  REGION: us-central1
  REPO_NAME: cloudlens-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # Ensure Artifact Registry exists before building and pushing images
      - name: Terraform Apply (Artifact Registry Only)
        working-directory: ./terraform
        run: terraform apply -target=google_artifact_registry_repository.repo -auto-approve
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Backend Image
        run: |
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          docker build -t $IMAGE_NAME ./backend
          docker push $IMAGE_NAME
          echo "BACKEND_IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Build and Push Frontend Image
        run: |
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }}
          # The frontend build requires VITE_API_BASE_URL. We will provide a placeholder during build 
          # and override it via Cloud Run environment variables at runtime, OR we need the actual backend URL here.
          # Since the frontend uses Nginx in production, we should ideally inject it or proxy it.
          # For Cloud Run, injecting env vars at runtime is possible if the frontend app fetches it, 
          # but Vite bakes it in at build time. For this pipeline, we'll build it, 
          # and the Terraform will provision the Cloud Run service.
          docker build -t $IMAGE_NAME ./frontend
          docker push $IMAGE_NAME
          echo "FRONTEND_IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Terraform Apply (Full Deployment)
        working-directory: ./terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_backend_image: ${{ env.BACKEND_IMAGE }}
          TF_VAR_frontend_image: ${{ env.FRONTEND_IMAGE }}
